{% extends "base.html" %}
{% block title %}Sign in — {{ site_name }}{% endblock %}
{% block content %}

<div class="detail-wrap" style="max-width:420px;">
  <div class="section-eyebrow">Account</div>
  <h1 style="font-size:28px;">Sign in</h1>

  <form method="post">
    {% csrf_token %}
    {% if form.errors %}<p style="color:#F0654F; font-size:13px; margin-bottom:16px;">Incorrect username or password.</p>{% endif %}
    {% for field in form %}
    <div class="field" style="margin-bottom:16px;">
      <label>{{ field.label }}</label>
      {{ field }}
    </div>
    {% endfor %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Sign in</button>
  </form>

  <p style="color:var(--text-muted); font-size:13.5px; margin-top:20px;">
    New here? <a href="{% url 'core:register' %}" style="color:var(--mint); text-decoration:underline;">Create an account</a>
  </p>
</div>

<style>
  .field input{ width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:11px 12px; font-family:var(--font-body); font-size:14px; }
  .field input:focus{ border-color:var(--mint-dim); outline:none; }
  .field label{ display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:6px; font-weight:500; }
</style>

{% endblock %}
